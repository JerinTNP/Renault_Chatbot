# version: '3.8'

services:
  # --- DATABASE SERVICE ---
  db:
    image: postgres:15
    container_name: renault_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Host mode: Binds directly to localhost:5432 on the server.
    # ⚠️ MAKE SURE port 5432 is free on this server!
    network_mode: "host"

  # --- BACKEND SERVICE ---
  backend:
    build: .
    container_name: renault_backend
    # Run uvicorn directly
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - vectorstore_volume:/code/vectorstore
      # You can remove the mass_upload_files volume if you aren't using it on the server
    env_file:
      - .env
    network_mode: "host"
    # --- ADD THIS ---
    depends_on:
      - db
    # ----------------

  # --- FRONTEND SERVICE ---
  frontend:
    build: .
    container_name: renault_frontend
    command: streamlit run streamlit_app/app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      - API_BASE_URL=http://localhost:8000
    network_mode: "host"
    depends_on:
      - backend

volumes:
  vectorstore_volume:
  postgres_data: