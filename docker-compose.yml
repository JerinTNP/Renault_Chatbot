version: '3.8'

services:
  # --- BACKEND SERVICE ---
  backend:
    build: .
    container_name: renault_backend
    # Command to start FastAPI from the root directory
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      # 1. Persist the Vectorstore (Crucial!)
      - vectorstore_volume:/code/vectorstore
      # 2. Persist the uploaded files folder (Optional but recommended)
      - uploaded_files_volume:/code/app/mass_upload_files
    env_file:
      - .env  # Loads your existing .env file
    ports:
      - "8000:8000"
    networks:
      - chatbot_net

  # --- FRONTEND SERVICE ---
  frontend:
    build: .
    container_name: renault_frontend
    # Command to start Streamlit
    command: streamlit run streamlit_app/app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      # Docker networking: points to the 'backend' service name defined above
      - API_BASE_URL=http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - chatbot_net

# Define the storage volumes
volumes:
  vectorstore_volume:
  uploaded_files_volume:

# Define the private network
networks:
  chatbot_net:
    driver: bridge